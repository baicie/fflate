name: Benchmark

on:
  push:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark
        run: pnpm run bench > /tmp/bench-raw.txt 2>&1 || true; node scripts/benchReport.mjs /tmp/bench-raw.txt

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: ${{ runner.temp }}/bench-results/
          retention-days: 14

      - name: Publish to GitHub Summary
        run: cat ${{ runner.temp }}/bench-results/benchmark-report.md >> $GITHUB_STEP_SUMMARY
